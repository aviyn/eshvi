name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: eshvi-macos-arm64
          # Linux and Windows are off until things settle; their steps below
          # stay, so turning them back on is uncommenting these.
          # - name: Linux
          #   os: ubuntu-latest
          #   artifact: eshvi-linux-x86_64
          # - name: Windows
          #   os: windows-latest
          #   artifact: eshvi-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages (windowing, keyboard, GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev

      # The integration tests drive a real `nvim --embed` (0.12 or later);
      # they skip themselves when nvim is missing, so make that an error.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Neovim version
        shell: bash
        run: nvim --version | head -1

      # slang v12.1 with our patch, for svtrace (the signal trace), which the app
      # ships beside eshvi. A cold build is a few minutes; the cache keeps it.
      - name: Cache slang
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/slang-v12.1
            ~/.cache/slang-v12.1-src
          key: slang-v12.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-slang.sh', 'scripts/slang-ast-json-compact.patch') }}
      - name: Build slang
        if: runner.os == 'macOS'
        run: scripts/build-slang.sh

      # (The whole workspace: eshvi and svtrace.)
      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh target/release/eshvi dist
          # (The script leaves the signal trace out, with a note, when they're missing.)
          test -x dist/Eshvi.app/Contents/MacOS/svtrace
          test -x dist/Eshvi.app/Contents/MacOS/slang
          dist/Eshvi.app/Contents/MacOS/slang --help | grep -q -- --ast-json-compact
          ditto -c -k --keepParent dist/Eshvi.app dist/${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C target/release eshvi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/eshvi.exe dist/${{ matrix.artifact }}.exe

      # One file, uploaded as is: downloading it gives that file, not a zip
      # of it (a zip inside a zip on macOS).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.artifact }}.*
          archive: false
          if-no-files-found: error
