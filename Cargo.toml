[workspace]
resolver = "2"
members = ["crates/grid", "crates/nvim-bridge", "crates/app", "crates/svtrace", "crates/term"]

[workspace.package]
edition = "2021"
version = "0.1.5"
license = "MIT"

[workspace.dependencies]
grid = { path = "crates/grid" }
nvim-bridge = { path = "crates/nvim-bridge" }
term = { path = "crates/term" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
nvim-rs = { version = "0.9", features = ["use_tokio"] }
async-trait = "0.1"
futures = "0.3"
eframe = "0.37"
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
png = "0.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }
fontique = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
resvg = { version = "0.48", default-features = false }
serde_json = "1"
ignore = "0.4"
nucleo-matcher = "0.3"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "8"
trash = "5"
rfd = "0.17"
lsp-server = "0.7"

[profile.dev]
debug = "line-tables-only"   # keeps file/line numbers in backtraces

[profile.dev.package."*"]
debug = false                # no debug info for dependencies
